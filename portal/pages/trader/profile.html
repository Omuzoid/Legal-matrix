<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trader Profile: Legal Matrix</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../components/button.css">
  <link rel="stylesheet" href="../../components/card.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-sidebar-container"></div>

    <div class="app-main">
      <div id="app-header-container"></div>

      <div class="content-body">
        <div style="max-width: 720px; margin: 0 auto;">
          <h1 style="font-size: var(--font-size-2xl); margin-bottom: var(--space-2);">Trader Profile & License</h1>
          <p style="color: var(--color-text-secondary); margin-bottom: var(--space-6);">Registered establishment particulars under UP Legal Metrology Rules</p>

          <div class="card" style="margin-bottom: var(--space-6);">
            <div style="display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-6);">
              <div style="width: 64px; height: 64px; border-radius: var(--radius-lg); background: var(--color-primary-light); display: flex; align-items: center; justify-content: center; color: var(--color-primary); border: 2px solid var(--color-primary-border);">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
              </div>
              <div>
                <h2 id="profile-business-name" style="font-size: var(--font-size-xl); margin: 0;">Registered Commercial Establishment</h2>
                <div id="profile-reg-details" style="color: var(--color-text-secondary); font-size: 14px;">Registration: State Legal Metrology Registry</div>
                <span class="badge badge-success" style="margin-top: 4px;">Verified Commercial Account</span>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
              <div>
                <label>Authorized Signatory</label>
                <input type="text" id="profile-proprietor" value="Authorized Representative" readonly style="background: var(--color-bg-subtle);">
              </div>
              <div>
                <label>Registered Mobile</label>
                <input type="tel" id="profile-mobile" value="Not Provided" readonly style="background: var(--color-bg-subtle);">
              </div>
            </div>

            <div style="margin-top: var(--space-4);">
              <label>Commercial Premises Address</label>
              <input type="text" id="profile-address" value="Registered Commercial Premises" readonly style="background: var(--color-bg-subtle);">
            </div>

            <div style="margin-top: var(--space-6); display: flex; justify-content: flex-end; gap: var(--space-3);">
              <button class="btn btn-outline" onclick="alert('Profile update request submitted to District Legal Metrology Officer.');">
                Request Particulars Update
              </button>
              <a href="/portal/pages/trader/dashboard.html" class="btn btn-primary">
                Back to Dashboard
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { injectHeader } from '../../layouts/header.js';
    import { injectSidebar } from '../../layouts/sidebar.js';
    import { authService } from '../../services/authService.js';

    injectHeader('app-header-container');
    injectSidebar('app-sidebar-container', 'trader', window.location.pathname);

    const currentUser = authService.getCurrentUser();
    if (currentUser) {
      if (currentUser.name) {
        document.getElementById('profile-business-name').textContent = currentUser.name;
        document.getElementById('profile-proprietor').value = currentUser.name;
      }
      if (currentUser.email) {
        document.getElementById('profile-reg-details').textContent = currentUser.email;
      }
    }
  </script>
</body>
</html>
