<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assigned Inspections: Legal Matrix</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../components/button.css">
  <link rel="stylesheet" href="../../components/card.css">
  <link rel="stylesheet" href="../../components/dataTable.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-sidebar-container"></div>

    <div class="app-main">
      <div id="app-header-container"></div>

      <div class="content-body">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6);">
          <div>
            <h1>Assigned Field Inspections</h1>
            <p>Today's field verification roster for assigned jurisdiction</p>
          </div>
          <a href="/portal/pages/inspector/inspect.html" class="btn btn-primary">
            + Start Custom Inspection
          </a>
        </div>

        <div class="card">
          <div id="schedule-list-mount"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { injectHeader } from '../../layouts/header.js';
    import { injectSidebar } from '../../layouts/sidebar.js';
    import { inspectionService } from '../../services/inspectionService.js';
    import { renderDataTable } from '../../components/dataTable.js';

    injectHeader('app-header-container');
    injectSidebar('app-sidebar-container', 'inspector', window.location.pathname);

    const mount = document.getElementById('schedule-list-mount');

    const columns = [
      {
        label: 'Time',
        key: 'time',
        render: (val) => `<span style="font-weight: 700; color: var(--india-blue); display: inline-flex; align-items: center; gap: 4px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>${val}</span>
        </span>`
      },
      { label: 'Trader / Shop', key: 'trader', render: (val, row) => `<strong>${val}</strong><br><span style="font-size: 12px; color: var(--text-muted);">${row.address || ''}</span>` },
      { label: 'Instrument', key: 'instrument' },
      { label: 'Status', key: 'status', render: (val, row) => `<span class="badge badge-${row.statusBadge || 'info'}">${val}</span>` },
      {
        label: 'Action',
        key: 'appNumber',
        render: (val, row) => `
          <a href="/portal/pages/inspector/inspect.html?app=${val}" class="btn btn-primary btn-sm">
            ${row.status === 'IN_PROGRESS' ? 'Resume' : 'Conduct Test &rarr;'}
          </a>
        `
      }
    ];

    async function loadData() {
      try {
        const schedule = await inspectionService.getSchedule();
        renderDataTable(mount, {
          columns,
          rows: schedule,
          emptyMessage: 'No assigned inspections.'
        });
      } catch (err) {
        console.error(err);
      }
    }
    loadData();
  </script>
</body>
</html>
