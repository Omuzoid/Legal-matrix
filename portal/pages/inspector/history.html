<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspection History: Legal Matrix</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../components/button.css">
  <link rel="stylesheet" href="../../components/card.css">
  <link rel="stylesheet" href="../../components/dataTable.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-sidebar-container"></div>

    <div class="app-main">
      <div id="app-header-container"></div>

      <div class="content-body">
        <div style="margin-bottom: var(--space-6);">
          <h1>Inspection History & Past Stamps</h1>
          <p>Historical audit of calibrated instruments and issued certification stamps</p>
        </div>

        <div class="card">
          <div id="history-table-mount"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { injectHeader } from '../../layouts/header.js';
    import { injectSidebar } from '../../layouts/sidebar.js';
    import { renderDataTable } from '../../components/dataTable.js';

    injectHeader('app-header-container');
    injectSidebar('app-sidebar-container', 'inspector', window.location.pathname);

    const mount = document.getElementById('history-table-mount');

    const columns = [
      { label: 'Date', key: 'date' },
      { label: 'Trader', key: 'trader' },
      { label: 'Instrument', key: 'instrument' },
      { label: 'Observed Error', key: 'error' },
      { label: 'Verdict', key: 'verdict', render: (val) => `<span class="badge ${val === 'PASSED' ? 'badge-success' : 'badge-danger'}">${val}</span>` },
      { label: 'Certificate', key: 'cert', render: (val) => val ? `<a href="/portal/pages/trader/certificates.html?cert=${val}" class="btn btn-outline btn-sm">View Cert</a>` : 'N/A' }
    ];

    // Dynamic inspection history populated via field inspector sync API
    const rows = [];

    renderDataTable(mount, { columns, rows, emptyMessage: 'No past inspection records recorded for this officer.' });
  </script>
</body>
</html>
