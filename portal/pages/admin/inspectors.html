<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspectors Roster: Legal Matrix</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../components/button.css">
  <link rel="stylesheet" href="../../components/card.css">
  <link rel="stylesheet" href="../../components/dataTable.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-sidebar-container"></div>

    <div class="app-main">
      <div id="app-header-container"></div>

      <div class="content-body">
        <div style="margin-bottom: var(--space-6);">
          <h1>Field Inspector Force</h1>
          <p>Authorized legal metrology field officers, zone allocation, and workload statistics</p>
        </div>

        <div class="card">
          <div id="inspectors-table-mount"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { injectHeader } from '../../layouts/header.js';
    import { injectSidebar } from '../../layouts/sidebar.js';
    import { renderDataTable } from '../../components/dataTable.js';

    injectHeader('app-header-container');
    injectSidebar('app-sidebar-container', 'admin', window.location.pathname);

    const mount = document.getElementById('inspectors-table-mount');

    const columns = [
      { label: 'Officer Name', key: 'name', render: (val) => `<strong style="color: var(--india-blue);">${val}</strong>` },
      { label: 'Badge ID', key: 'badge' },
      { label: 'Assigned Zone', key: 'zone' },
      { label: 'Pending Inspections', key: 'pending', render: (val) => `<span class="badge badge-warning">${val} Pending</span>` },
      { label: 'Stamps Issued This Month', key: 'completed', render: (val) => `<span class="badge badge-success">${val} Verified</span>` },
      { label: 'Status', key: 'status', render: () => `<span class="badge badge-success">On Duty</span>` }
    ];

    // Dynamic officer roster populated via official department registry
    const rows = [];

    renderDataTable(mount, { columns, rows, emptyMessage: 'No field officers or inspectors registered in this jurisdiction.' });
  </script>
</body>
</html>
