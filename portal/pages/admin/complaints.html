<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Complaints Triage: Legal Matrix</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../components/button.css">
  <link rel="stylesheet" href="../../components/card.css">
  <link rel="stylesheet" href="../../components/dataTable.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-sidebar-container"></div>

    <div class="app-main">
      <div id="app-header-container"></div>

      <div class="content-body">
        <div style="margin-bottom: var(--space-6);">
          <h1>Consumer Grievances & Fraud Reports</h1>
          <p>Triage complaints filed by citizens regarding inaccurate weights, faulty meters, and fraudulent certificates</p>
        </div>

        <div class="card">
          <div id="complaints-table-mount"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { injectHeader } from '../../layouts/header.js';
    import { injectSidebar } from '../../layouts/sidebar.js';
    import { renderDataTable } from '../../components/dataTable.js';

    injectHeader('app-header-container');
    injectSidebar('app-sidebar-container', 'admin', window.location.pathname);

    const mount = document.getElementById('complaints-table-mount');

    const columns = [
      { label: 'Grievance ID', key: 'id', render: (val) => `<strong>${val}</strong>` },
      { label: 'Reported Store', key: 'shop', render: (val, row) => `<strong>${val}</strong><br><span style="font-size: 12px; color: var(--text-muted);">${row.address || ''}</span>` },
      {
        label: 'Issue Category',
        key: 'issue',
        render: (val) => `<span class="badge badge-danger" style="display: inline-flex; align-items: center; gap: 4px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>${val}</span>
        </span>`
      },
      { label: 'Description', key: 'desc' },
      { label: 'Status', key: 'status', render: (val) => `<span class="badge badge-warning">${val}</span>` },
      {
        label: 'Action',
        key: 'id',
        render: (val) => `
          <button class="btn btn-outline btn-sm" onclick="alert('Investigation report dispatched to zone field officer for ' + '${val}' + '.')">
            Dispatch Inspector
          </button>
        `
      }
    ];

    // Dynamic consumer grievances populated via citizen portal API
    const rows = [];

    renderDataTable(mount, { columns, rows, emptyMessage: 'No consumer grievances currently lodged in triage queue.' });
  </script>
</body>
</html>
